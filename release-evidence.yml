reason_for_patch_release:
  initial_release: v0.3.0
  initial_release_commit: c6d19cf5cf14da8183ced2a06aa952e9d14744c9
  findings:
    - Emacs 27.2 could not resolve the current Transient development dependency, which requires Emacs 28.1.
    - Emacs 29.4 warnings-as-errors compilation rejected direct calls to Transient prefix commands marked for interactive use only.
    - Generated autoload loading could encounter Transient prefix expansion before Transient was loaded.
    - actions/checkout@v4 emitted a hosted Node.js 20 deprecation warning.
  disposition:
    - Move the full optional-integration matrix floor to Emacs 28.1 while retaining the documented Emacs 25.1 core target.
    - Keep Transient prefix macros behind autoloaded wrapper functions.
    - Dispatch prefix commands with call-interactively and declare optional functions explicitly.
    - Upgrade checkout to actions/checkout@v5.
    - Restrict push CI to master to avoid duplicate branch and tag runs.

