scope:
  release_type: patch
  rationale: >-
    The work hardens existing palette loading, package metadata, CI, and
    distributable artifacts without adding a new provider API or breaking
    public behavior.
  delivered:
    - validate external pywal-compatible cache structure before activation
    - retry reads when cache files are rewritten or replaced mid-read
    - detect timestamp-preserving replacements through extended file identity
    - fall back to bundled palettes for malformed or incomplete external input
    - lint every published package boundary independently
    - pin GitHub Actions to immutable revisions
    - package and smoke-test bundled palette resources

cache_contract:
  required_sections:
    - special
    - colors
  required_roles:
    - background
    - foreground
  required_ansi_entries: 1
  optional_roles:
    - cursor
  default_read_retries: 2
  source_signature_fields:
    - modification_time
    - status_change_time
    - size
    - inode
    - device
  failure_behavior: log the external error and load the configured built-in palette

